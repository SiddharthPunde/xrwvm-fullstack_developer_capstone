name: Full-Stack Dealership CI/CD Pipeline

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-python:
    name: Lint Python Files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Linter
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=.venv,venv,node_modules
          # Exit-zero treats all errors as warnings
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics --exclude=.venv,venv,node_modules

  frontend-build:
    name: Build React Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build Production Frontend
        working-directory: ./frontend
        run: npm run build

  backend-tests:
    name: Django Backend Checks & Automated Tests
    runs-on: ubuntu-latest
    needs: [lint-python]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Django System Checks
        run: |
          python manage.py check

      - name: Apply Migrations in Test Environment
        run: |
          python manage.py migrate --noinput

      - name: Seed Database
        run: |
          python manage.py seed_dealerships

      - name: Verify Assignment API Endpoints
        run: |
          set -e
          python manage.py runserver 127.0.0.1:8000 --noreload > /tmp/dealership-django.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:8000/api/dealers/ > /dev/null; then
              break
            fi
            sleep 1
          done

          curl --silent --show-error --fail \
            --output /tmp/dealers.json \
            --write-out "GET /fetchDealers HTTP_STATUS=%{http_code}\n" \
            http://127.0.0.1:8000/fetchDealers

          python -c "import json; dealers=json.load(open('/tmp/dealers.json')); print('DEALERS_RETURNED='+str(len(dealers))); assert len(dealers)==50, f'Expected 50 dealers, got {len(dealers)}'"

          curl --silent --show-error --fail \
            --output /tmp/sentiment.json \
            --write-out "GET /analyze/Fantastic%20services HTTP_STATUS=%{http_code}\n" \
            http://127.0.0.1:8000/analyze/Fantastic%20services

          python -c "import json; result=json.load(open('/tmp/sentiment.json')); print('SENTIMENT_RESPONSE='+json.dumps(result)); assert result['sentiment']=='positive'"

      - name: Run Full Backend Test Suite
        run: |
          python manage.py test server.tests
