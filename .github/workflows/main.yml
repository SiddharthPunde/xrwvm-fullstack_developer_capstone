name: Capstone CI
on:
  push:
    branches: [main, capstone-completion]
  pull_request:
    branches: [main]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Python syntax check
        run: python -m compileall -q server/djangoapp server/djangoproj
      - name: Node syntax check
        run: node --check server/database/app.js
      - name: Install frontend dependencies
        working-directory: server/frontend
        run: npm ci
      - name: Build React frontend
        working-directory: server/frontend
        run: npm run build
